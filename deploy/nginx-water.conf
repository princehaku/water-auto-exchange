# Include inside the existing bytegallop.com HTTPS server block.
location = /water {
    return 308 /water/$is_args$args;
}

# Keep this prefix ahead of the site's generic static-file regex locations.
location ^~ /water/ {
    root /var/www/water-auto-exchange;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
