<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自动换水 · Water Auto Exchange</title>
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#143c43;background:#edf6f5}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(680px,100%);padding:clamp(28px,6vw,56px);background:white;border:1px solid #d3e6e3;border-radius:24px}
    .label{color:#26796c;font-size:13px;letter-spacing:.12em}h1{font-size:clamp(32px,7vw,48px);margin:16px 0}p{line-height:1.8;color:#526e71}
    .status{display:inline-block;background:#e6f5ef;color:#236b53;border-radius:999px;padding:8px 14px;font-size:14px}
    .note{border-top:1px solid #e2ecea;margin-top:28px;padding-top:20px;font-size:14px}footer{margin-top:28px;font-size:12px;color:#788f91}
  </style>
</head>
<body><main>
  <div class="label">WATER AUTO EXCHANGE</div>
  <h1>自动换水</h1>
  <span class="status">项目入口已就绪</span>
  <p>用于鱼缸与水箱的水位监测、排水和补水。</p>
  <p class="note">网页控制与设备接入尚未配置。当前页面仅展示项目入口，设备操作请继续使用本地控制流程。</p>
  <footer>bytegallop.com / water</footer>
</main></body>
</html>
